name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packager
        run: python -m pip install pyinstaller==6.22.2

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name CuteClaudeMonitor
          --add-data "widget.ps1;."
          --add-data "config.example.json;."
          native_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: CuteClaudeMonitor-Windows
          path: dist/CuteClaudeMonitor.exe
          if-no-files-found: error

      - name: Attach executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/CuteClaudeMonitor.exe
          --title "Cute Claude Monitor ${{ github.ref_name }}"
          --generate-notes
