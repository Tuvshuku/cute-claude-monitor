name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install packager
        run: python -m pip install pyinstaller==6.22.2

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ClaudeUsageBot
          --add-data "widget.ps1;."
          --add-data "config.example.json;."
          native_app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ClaudeUsageBot-Windows
          path: dist/ClaudeUsageBot.exe
          if-no-files-found: error

      - name: Attach executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/ClaudeUsageBot.exe --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist/ClaudeUsageBot.exe `
              --title "Claude Usage Bot ${{ github.ref_name }}" --generate-notes
          }
