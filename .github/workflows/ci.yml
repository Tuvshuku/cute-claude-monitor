name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install linter
        run: python -m pip install ruff==0.13.2

      - name: Lint Python
        run: ruff check collector.py native_app.py tests

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check Bash syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh run-collector.sh status.sh

      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @('widget.ps1', 'run-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

